<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Replab — Owner dashboard</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin.css"></head><body class="admin-body"><header class="site-header"><a class="brand" href="/"><img src="/assets/replab-logo.png" alt="Replab"></a><nav><a href="/">View shop ↗</a></nav><span class="admin-tag">OWNER AREA</span></header><main class="admin-main"><section id="loginPanel" class="login-panel"><p class="eyebrow">REPLAB / PRIVATE</p><h1>Owner <em>login.</em></h1><p>Sign in to manage your shop and orders.</p><form id="loginForm"><label>Owner password<input type="password" name="password" required autocomplete="current-password"></label><p id="loginError" class="error"></p><button class="button button-dark full">Sign in <span>↗</span></button></form></section><section id="dashboard" hidden><div class="dash-heading"><div><p class="eyebrow">REPLAB / OVERVIEW</p><h1>Orders <em>& stock.</em></h1></div><button id="logout" class="outline-button">Log out</button></div><div class="stats" id="stats"></div><div class="dash-tabs"><button class="tab active" data-tab="orders">Orders</button><button class="tab" data-tab="products">Products</button></div><section id="ordersPanel"><div class="panel-heading"><h2>Recent orders</h2><button class="outline-button" id="refreshOrders">Refresh ↻</button></div><div id="ordersList" class="orders-list"></div></section><section id="productsPanel" hidden><div class="panel-heading"><h2>Your products</h2></div><form id="productForm" class="product-form"><h3>Add a new piece</h3><div class="form-grid"><label>Product name<input name="name" required></label><label>Brand<input name="brand"></label><label>Brand<select name="brand"><option>Alo</option><option>Canada Goose</option><option>Coach</option><option>Moncler</option><option>Other</option></select></label><label>Size<input name="size" placeholder="e.g. M" required></label><label>Condition<select name="condition"><option>Very good</option><option>Good</option><option>Like new</option><option>Fair</option></select></label><label>Price (€)<input name="price" type="number" min="0.01" step="0.01" required></label><label class="wide">Image URL<input name="image_url" type="url" placeholder="https://..."></label><label class="wide">Description<textarea name="description" rows="2"></textarea></label></div><p class="error" id="productError"></p><button class="button button-dark">Add product <span>＋</span></button></form><div id="productList" class="product-list"></div></section></section></main><script src="/admin.js"></script></body></html>
